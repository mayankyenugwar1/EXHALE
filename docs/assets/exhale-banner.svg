<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d" />
      <stop offset="50%" stop-color="#070b18" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Nebula Radial Glows -->
    <radialGradient id="nebulaLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#04060d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaRight" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#0c4a6e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#04060d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaCenter" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#312e81" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#04060d" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Ribbon Gradients -->
    <linearGradient id="ribbonPrimary" x1="25" y1="70" x2="285" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="28%" stop-color="#6b7bff" stop-opacity="0.85" />
      <stop offset="62%" stop-color="#a78bfa" stop-opacity="1.0" />
      <stop offset="88%" stop-color="#e6e6ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="ribbonSecondary" x1="40" y1="76" x2="278" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1b3d" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#6b7bff" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#a78bfa" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6b7bff" stop-opacity="0.25" />
    </linearGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6b7bff" stop-opacity="0" />
    </radialGradient>

    <filter id="ribbonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .wordmark {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0.38em;
      fill: #ffffff;
    }
    .tagline {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.32em;
      fill: #94a3b8;
    }
    .side-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 8.5px;
      font-weight: 400;
      letter-spacing: 0.25em;
      fill: #475569;
    }
  </style>

  <!-- Background base -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="12" fill="url(#nebulaLeft)" />
  <rect width="900" height="240" rx="12" fill="url(#nebulaRight)" />
  <rect width="900" height="240" rx="12" fill="url(#nebulaCenter)" />

  <!-- Subtle Border Frame -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="11.5" fill="none" stroke="#1e293b" stroke-opacity="0.5" />

  <!-- Ambient Stars -->
  <g opacity="0.6">
    <circle cx="80" cy="40" r="1.2" fill="#e2e8f0" />
    <circle cx="120" cy="180" r="0.8" fill="#94a3b8" />
    <circle cx="210" cy="60" r="1.4" fill="#d8b4fe" />
    <circle cx="280" cy="190" r="1.0" fill="#cbd5e1" />
    <circle cx="340" cy="30" r="0.8" fill="#e2e8f0" />
    <circle cx="560" cy="45" r="1.1" fill="#c084fc" />
    <circle cx="620" cy="200" r="0.9" fill="#94a3b8" />
    <circle cx="690" cy="50" r="1.5" fill="#e2e8f0" />
    <circle cx="760" cy="170" r="1.2" fill="#7dd3fc" />
    <circle cx="820" cy="80" r="0.8" fill="#e2e8f0" />
    <circle cx="850" cy="195" r="1.0" fill="#d8b4fe" />
  </g>

  <!-- Horizon Arc (Bottom Left) -->
  <path d="M -50 290 A 240 240 0 0 1 220 250" fill="none" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Side Whispers -->
  <text x="45" y="45" class="side-text">A CALMER YOU,</text>
  <text x="45" y="58" class="side-text">A BRIGHTER TOMORROW.</text>
  <line x1="45" y1="68" x2="160" y2="68" stroke="#334155" stroke-opacity="0.4" stroke-width="0.75" />

  <text x="700" y="195" class="side-text">IT'S JUST A THOUGHT.</text>
  <text x="700" y="208" class="side-text">YOU CAN LET IT DRIFT.</text>
  <line x1="700" y1="218" x2="855" y2="218" stroke="#334155" stroke-opacity="0.4" stroke-width="0.75" />

  <!-- Center Group: S-Wave Brand Ribbon + Logo -->
  <g transform="translate(270, 22)">
    <!-- Backing Glow -->
    <g filter="url(#ribbonGlow)" opacity="0.7">
      <path d="M 25 70 C 65 70, 95 88, 145 66 C 195 44, 235 18, 285 28" stroke="url(#ribbonPrimary)" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M 40 76 C 78 78, 105 92, 150 72 C 190 56, 228 32, 278 36" stroke="url(#ribbonSecondary)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Main Ribbon Line -->
    <path d="M 25 70 C 65 70, 95 88, 145 66 C 195 44, 235 18, 285 28" stroke="url(#ribbonPrimary)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Secondary Under-Ribbon -->
    <path d="M 40 76 C 78 78, 105 92, 150 72 C 190 56, 228 32, 278 36" stroke="url(#ribbonSecondary)" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Dispersing Stars -->
    <!-- Star 1 (Main) -->
    <circle cx="304" cy="20" r="2.4" fill="#ffffff" />
    <circle cx="304" cy="20" r="7" fill="url(#starGlow)" opacity="0.9" />
    <line x1="304" y1="12" x2="304" y2="28" stroke="#ffffff" stroke-width="0.75" opacity="0.75" />
    <line x1="296" y1="20" x2="312" y2="20" stroke="#ffffff" stroke-width="0.75" opacity="0.75" />

    <!-- Star 2 -->
    <circle cx="324" cy="30" r="1.8" fill="#a78bfa" />
    <circle cx="324" cy="30" r="5" fill="url(#starGlow)" opacity="0.75" />
    <line x1="324" y1="24" x2="324" y2="36" stroke="#ffffff" stroke-width="0.6" opacity="0.6" />
    <line x1="318" y1="30" x2="330" y2="30" stroke="#ffffff" stroke-width="0.6" opacity="0.6" />

    <!-- Star 3 -->
    <circle cx="308" cy="42" r="1.4" fill="#6b7bff" />
    <circle cx="308" cy="42" r="4" fill="url(#starGlow)" opacity="0.6" />
    <line x1="308" y1="37" x2="308" y2="47" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />
    <line x1="303" y1="42" x2="313" y2="42" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />

    <!-- Star 4 -->
    <circle cx="334" cy="48" r="1.0" fill="#e6e6ff" />
    <circle cx="334" cy="48" r="3" fill="url(#starGlow)" opacity="0.45" />

    <!-- Star 5 -->
    <circle cx="292" cy="50" r="0.8" fill="#ffffff" />
  </g>

  <!-- Centered Wordmark & Tagline -->
  <g text-anchor="middle">
    <text x="450" y="160" class="wordmark">EXHALE</text>
    <text x="450" y="194" class="tagline">GIVE YOUR MIND SOME SPACE.</text>
  </g>
</svg>
